name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: make build (wrapper binary, version injection)
        run: make build
      - name: go test
        # The live test (regru/live_test.go) is skipped unless REGRU_LIVE=1.
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        # v8 supports golangci-lint >= v2.1.0 (v6 is golangci-lint v1 only).
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
